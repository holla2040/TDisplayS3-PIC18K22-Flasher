<text x="328" y="250" font-size="12" fill="#777" font-weight="bold">Not used for LVP</text>
<text x="328" y="267" font-size="11" fill="#777">8.5 V boost, Q1, Q2, Q3, R1–R6 (HV only).</text>
<text x="328" y="282" font-size="11" fill="#777">GPIO10 (VPP_ON) is not connected.</text>
<text x="328" y="297" font-size="11" fill="#777">No MCLR pull-up needed on the target.</text>

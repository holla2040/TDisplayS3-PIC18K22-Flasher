<text x="380" y="642.5" font-size="12.5" fill="#333">GPIO3 → ICSP 1 (MCLR), push-pull</text>
<line x1="340" y1="664" x2="368" y2="664" stroke="#000" stroke-width="7" stroke-linecap="round"/><line x1="340" y1="664" x2="368" y2="664" stroke="#2b2b2b" stroke-width="4.6" stroke-linecap="round"/>
<text x="380" y="668.5" font-size="12.5" fill="#333">GND → ICSP 3, one common net</text>
<rect x="760" y="520" width="420" height="160" rx="6" fill="#fff" stroke="#c9c9c2"/>
<text x="772" y="540" font-size="13" fill="#222" font-weight="bold">LVP entry / exit (DS41398B §2.6)</text>
<text x="772" y="562" font-size="11.5" fill="#444">GPIO3 low: MCLR to VIL. Wait P18 ≥ 1 ms.</text>
<text x="772" y="579" font-size="11.5" fill="#444">Key 4D434850h on PGD, 32 bits, MSb first.</text>
<text x="772" y="596" font-size="11.5" fill="#444">GPIO3 high: MCLR to VIH (P20 ≥ 40 ns after last PGC).</text>
<text x="772" y="613" font-size="11.5" fill="#444">Wait P15 ≥ 400 µs, then the usual LSb-first frames.</text>
<text x="772" y="630" font-size="11.5" fill="#444">Exit: GPIO3 low (P16 ≥ 0 after the last PGC).</text>
<text x="772" y="647" font-size="11.5" fill="#444">Release: GPIO3 high, the target runs.</text>
<text x="772" y="666" font-size="11.5" fill="#a04f00" font-weight="bold">Default build: #define ICSP_LVP 1 (config.h).</text>
</svg>
